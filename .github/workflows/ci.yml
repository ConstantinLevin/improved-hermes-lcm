name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Daily: the plugin targets the latest Hermes main, which moves without us.
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint GitHub Actions workflows
        run: |
          "$(go env GOPATH)"/bin/actionlint

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff==0.15.13

      - name: Lint with ruff
        run: ruff check .

      - name: Check shell syntax
        # One file per call: `bash -n a b` parses only `a` and passes `b` as an argument.
        run: |
          bash -n scripts/install.sh
          bash -n scripts/update.sh

  host-load:
    # Installs the plugin into a scratch Hermes home against the latest Hermes main and
    # fails unless it loads, registers its context engine, and the host selects that engine
    # for `context.engine: lcm` instead of falling back to its built-in compressor.
    # It proves import, registration and selection; nothing about compaction, the tools,
    # the hooks, or a session.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set scratch paths
        run: |
          echo "HERMES_HOME=$RUNNER_TEMP/hermes-home" >> "$GITHUB_ENV"
          echo "HERMES_SRC=$RUNNER_TEMP/hermes-agent" >> "$GITHUB_ENV"

      - name: Clone the latest Hermes main
        run: |
          git clone --depth 1 https://github.com/nousresearch/hermes-agent "$HERMES_SRC"
          echo "Hermes main at $(git -C "$HERMES_SRC" rev-parse HEAD)"

      - name: Set up Python (the host's floor)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Install the host's core dependencies
        run: |
          python - "$HERMES_SRC/pyproject.toml" > "$RUNNER_TEMP/hermes-requirements.txt" <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as handle:
              print("\n".join(tomllib.load(handle)["project"]["dependencies"]))
          PY
          pip install -r "$RUNNER_TEMP/hermes-requirements.txt"

      - name: Install the plugin into the scratch Hermes home
        run: |
          mkdir -p "$HERMES_HOME"
          bash scripts/install.sh
          printf 'plugins:\n  enabled:\n    - hermes-lcm\ncontext:\n  engine: lcm\n' > "$HERMES_HOME/config.yaml"

      - name: Load the plugin and let the host select its context engine
        # Run outside the checkout: from its root, the plugin's own tools.py would shadow
        # the host's `tools` package on sys.path.
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ${{ runner.temp }}/hermes-agent
        run: |
          python - <<'PY'
          import sys

          from agent.agent_init import _select_context_engine
          from hermes_cli.plugins import get_plugin_context_engine, get_plugin_manager

          failures = []
          manager = get_plugin_manager()
          manager.discover_and_load()
          entries = [p for p in manager.list_plugins() if p.get("name") == "hermes-lcm"]
          print("plugin:", entries)
          if len(entries) != 1 or entries[0].get("error"):
              failures.append(f"plugin hermes-lcm did not load: {entries}")

          registered = get_plugin_context_engine()
          print("registered engine:", type(registered).__name__, getattr(registered, "name", None))
          if registered is None or registered.name != "lcm":
              failures.append("no context engine named 'lcm' was registered")

          selected = _select_context_engine({"context": {"engine": "lcm"}})
          print("selected engine:", type(selected).__name__, getattr(selected, "name", None))
          if selected is None or selected.name != "lcm":
              failures.append("the host did not select 'lcm' and fell back to its built-in compressor")
          else:
              print("tool schemas (reported, not asserted):", len(selected.get_tool_schemas()))

          for failure in failures:
              print("FAIL:", failure, file=sys.stderr)
          sys.exit(1 if failures else 0)
          PY
